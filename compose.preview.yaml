services:
  preview:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:3002:80"
    volumes:
      - ./preview/index.html:/usr/share/nginx/html/index.html:ro
      - ./preview/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - default
    restart: unless-stopped
