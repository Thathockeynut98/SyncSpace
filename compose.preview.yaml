services:
  preview:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:3002:80"
    volumes:
      - ./preview/index.html:/usr/share/nginx/html/index.html:ro
      - ./preview/vault.js:/usr/share/nginx/html/vault.js:ro
      - ./preview/calling.js:/usr/share/nginx/html/calling.js:ro
      - ./preview/messaging.js:/usr/share/nginx/html/messaging.js:ro
      - ./preview/message-crypto.mjs:/usr/share/nginx/html/message-crypto.mjs:ro
      - ./preview/inventory.js:/usr/share/nginx/html/inventory.js:ro
      - ./preview/polish.css:/usr/share/nginx/html/polish.css:ro
      - ./preview/home-layout.css:/usr/share/nginx/html/home-layout.css:ro
      - ./preview/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - default
    restart: unless-stopped
