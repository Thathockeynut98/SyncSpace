<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SyncSpace — Local Preview</title><style>body{background:#0e1020;color:#f1f1fa;font:16px system-ui;margin:0}main{max-width:850px;margin:60px auto;padding:24px}.card{background:#1c2036;padding:25px;border-radius:18px;margin-bottom:20px}input,button{font:inherit;padding:12px;border-radius:9px;border:1px solid #596078;margin:7px 0}input{background:#101528;color:white;display:block;width:95%}button{background:#8d7afa;color:#100e25;cursor:pointer;font-weight:700}button:disabled{opacity:.5}.muted{color:#a9b0ca}.message{padding:12px;border-bottom:1px solid #363b53}code{word-break:break-all}#app[hidden],#login[hidden]{display:none}</style></head><body><main><h1>✦ SyncSpace</h1><p class="muted">Private local migration preview · read-only</p><section id="login" class="card"><h2>Sign in</h2><form id="form"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section><section id="app" hidden><div class="card"><button id="logout">Log out</button><h2>Your shared space</h2><div id="spaces"></div></div><div class="card"><h2>Imported messages</h2><p class="muted">Encrypted payloads are intentionally not displayed. Decryption and interactive chat will follow after the original encryption code is verified.</p><div id="messages"></div></div></section><p id="status" role="status"></p></main><script>let token=null;const el=id=>document.getElementById(id);async function call(path,opts={}){const r=await fetch('/api'+path,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});if(!r.ok)throw Error('Request failed ('+r.status+')');return r.json()}el('form').addEventListener('submit',async e=>{e.preventDefault();el('status').textContent='Signing in…';try{const login=await call('/auth/login',{method:'POST',body:JSON.stringify({email:el('email').value,password:el('password').value})});token=login.token;el('password').value='';const data=await call('/spaces');el('spaces').replaceChildren();el('messages').replaceChildren();for(const space of data.spaces){const p=document.createElement('p');p.textContent=space.name||'Shared space';el('spaces').append(p);const result=await call('/spaces/'+encodeURIComponent(space.id)+'/messages');const q=document.createElement('p');q.textContent=result.messages.length+' imported encrypted messages available';el('messages').append(q)}if(!data.spaces.length)el('spaces').textContent='No spaces linked to this account.';el('login').hidden=true;el('app').hidden=false;el('status').textContent='Signed in to your local backend.'}catch(err){token=null;el('status').textContent=err.message}});el('logout').addEventListener('click',async()=>{try{await call('/auth/logout',{method:'POST'})}catch{}token=null;el('app').hidden=true;el('login').hidden=false;el('status').textContent='Signed out.'});</script></body></html>
