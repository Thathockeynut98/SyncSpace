services:
  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      SYNCSPACE_STUN_URL: ${SYNCSPACE_STUN_URL:-}
      SYNCSPACE_TURN_URL: ${SYNCSPACE_TURN_URL:-}
      SYNCSPACE_TURN_SECRET: ${SYNCSPACE_TURN_SECRET:-}
      SYNCSPACE_ALLOWED_ORIGINS: ${SYNCSPACE_ALLOWED_ORIGINS:-http://localhost:3003,http://127.0.0.1:3003}
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: syncspace
      PGUSER: syncspace
      PGPASSWORD: ${SYNCSPACE_DB_PASSWORD:?Set database password in .env}
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - syncspace_internal
      - default
    depends_on:
      db:
        condition: service_healthy
