# One-time importer. Mount only private Base44 CSV exports.
services:
  importer:
    image: python:3.12-slim
    profiles: ["tools"]
    working_dir: /work
    volumes:
      - ./scripts:/work/scripts:ro
      - ${SYNCSPACE_EXPORT_DIR:?Set SYNCSPACE_EXPORT_DIR to your private CSV folder}:/imports:ro
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: syncspace
      PGUSER: syncspace
      PGPASSWORD: ${SYNCSPACE_DB_PASSWORD:?Set database password in .env}
    command: ["sh", "-c", "pip install --no-cache-dir 'psycopg[binary]>=3.2,<4' && python scripts/import_csv.py --directory /imports"]
    networks:
      - syncspace_internal
      - default
    depends_on:
      db:
        condition: service_healthy
