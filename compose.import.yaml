# One-time importer. Keep CSV files on the host; never commit them.
# Run alongside compose.yaml and compose.database.yaml.
services:
  importer:
    image: python:3.12-slim
    profiles: ["tools"]
    working_dir: /work
    volumes:
      - ./scripts:/work/scripts:ro
      - ${SYNCSPACE_EXPORT_DIR:?Set SYNCSPACE_EXPORT_DIR to your private CSV folder}:/imports:ro
    environment:
      DATABASE_URL: postgresql://syncspace:${SYNCSPACE_DB_PASSWORD:?Set database password in .env}@db:5432/syncspace
    command: ["sh", "-c", "pip install --no-cache-dir 'psycopg[binary]>=3.2,<4' && python scripts/import_csv.py --directory /imports"]
    networks:
      - syncspace_internal
    depends_on:
      db:
        condition: service_healthy
